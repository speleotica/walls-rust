[package]
name = "walls-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
lines-inclusive = "0.0.0"
regex = "1.13.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
insta = { version = "1.48.0", features = ["glob", "yaml"] }

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
